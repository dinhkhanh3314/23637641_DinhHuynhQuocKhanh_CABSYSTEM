syntax = "proto3";

package payment;

service PaymentService {
  rpc CreatePayment (CreatePaymentRequest) returns (PaymentResponse);
  rpc GetPayment (GetPaymentRequest) returns (PaymentResponse);
  rpc GetPaymentByTrip (GetPaymentByTripRequest) returns (PaymentResponse);
  rpc ProcessPayment (ProcessPaymentRequest) returns (PaymentResponse);
  rpc EstimateFare (EstimateFareRequest) returns (FareResponse);
  rpc EstimateFareFromCoordinates (EstimateFareFromCoordinatesRequest) returns (FareResponse);
}

message EstimateFareRequest {
  int32 trip_id = 1;
}

message EstimateFareFromCoordinatesRequest {
  double pickup_latitude = 1;
  double pickup_longitude = 2;
  double destination_latitude = 3;
  double destination_longitude = 4;
}

message CreatePaymentRequest {
  int32 trip_id = 1;
  int32 customer_id = 2;
  reserved 3 to 5;
}

message GetPaymentRequest {
  int32 id = 1;
}

message GetPaymentByTripRequest {
  int32 trip_id = 1;
  reserved 2;
}

message ProcessPaymentRequest {
  int32 id = 1;
  reserved 2;
  double amount = 3;
  string payment_method = 4;
}

message PaymentResponse {
  int32 id = 1;
  int32 trip_id = 2;
  int32 customer_id = 3;
  double amount = 4;
  string payment_method = 5;
  string status = 6;
  string transaction_id = 7;
  string failure_reason = 8;
  string paid_at = 9;
  string failed_at = 10;
}

message FareResponse {
  int32 trip_id = 1;
  double distance_km = 2;
  double base_fare = 3;
  double price_per_km = 4;
  double total_fare = 5;
  string currency = 6;
}
