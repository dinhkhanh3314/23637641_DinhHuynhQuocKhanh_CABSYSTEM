syntax = "proto3";

package trip;

service TripService {
  rpc CreateTrip (CreateTripRequest) returns (TripResponse);
  rpc GetTrip (GetTripRequest) returns (TripResponse);
  rpc StartTrip (UpdateTripStatusRequest) returns (TripResponse);
  rpc CompleteTrip (UpdateTripStatusRequest) returns (TripResponse);
  rpc CancelTrip (CancelTripRequest) returns (TripResponse);
  rpc SubmitReview (SubmitReviewRequest) returns (ReviewResponse);
  rpc GetReview (GetReviewRequest) returns (ReviewResponse);
}

message CreateTripRequest {
  int32 bookingId = 1;
  int32 customerId = 2;
  int32 driverId = 3;
  double pickupLatitude = 4;
  double pickupLongitude = 5;
  double destinationLatitude = 6;
  double destinationLongitude = 7;
}

message GetTripRequest {
  int32 tripId = 1;
}

message UpdateTripStatusRequest {
  int32 tripId = 1;
}

message CancelTripRequest {
  int32 bookingId = 1;
  string reason = 2;
}

message SubmitReviewRequest {
  int32 tripId = 1;
  int32 reviewerId = 2;
  int32 rating = 3;
  string comment = 4;
}

message GetReviewRequest {
  int32 tripId = 1;
  int32 reviewerId = 2;
}

message TripResponse {
  bool success = 1;
  string message = 2;
  int32 tripId = 3;
  int32 bookingId = 4;
  int32 customerId = 5;
  int32 driverId = 6;
  double pickupLatitude = 7;
  double pickupLongitude = 8;
  double destinationLatitude = 9;
  double destinationLongitude = 10;
  string status = 11;
  string startedAt = 12;
  string completedAt = 13;
}

message ReviewResponse {
  int32 reviewId = 1;
  int32 tripId = 2;
  int32 reviewerId = 3;
  int32 revieweeId = 4;
  string reviewerType = 5;
  int32 rating = 6;
  string comment = 7;
  string status = 8;
}
