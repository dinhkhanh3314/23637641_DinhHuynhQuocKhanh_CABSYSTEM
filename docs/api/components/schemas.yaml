Error:
  type: object
  required: [code, message]
  properties:
    code:
      type: string
      description: Mã lỗi nghiệp vụ
      enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, ACCOUNT_ALREADY_EXISTS, INVALID_CREDENTIALS, ACCOUNT_LOCKED, BOOKING_NOT_CANCELLABLE, OFFER_EXPIRED, OFFER_ALREADY_RESPONDED, DRIVER_NOT_ACTIVE, TRIP_INVALID_TRANSITION, TRIP_NOT_IN_PROGRESS, TRIP_NOT_COMPLETED, PAYMENT_ALREADY_SUCCESS, PAYMENT_PROVIDER_ERROR, RATING_ALREADY_EXISTS, INTERNAL_ERROR]
    message: { type: string }
    details: { type: array, items: { type: object, properties: { field: { type: string }, issue: { type: string } } } }
Pagination:
  type: object
  properties: { page: { type: integer }, size: { type: integer }, totalItems: { type: integer }, totalPages: { type: integer } }
Role: { type: string, enum: [CUSTOMER, DRIVER, ADMIN] }
AccountStatus: { type: string, enum: [ACTIVE, LOCKED] }
RegisterRequest:
  type: object
  required: [fullName, phone, email, password]
  properties:
    fullName: { type: string }
    phone: { type: string }
    email: { type: string, format: email }
    password: { type: string, format: password, minLength: 8 }
LoginRequest:
  type: object
  required: [identifier, password]
  properties: { identifier: { type: string, description: Email hoặc số điện thoại }, password: { type: string, format: password } }
AuthToken:
  type: object
  properties:
    accessToken: { type: string }
    tokenType: { type: string, example: Bearer }
    expiresIn: { type: integer }
    role: { $ref: '#/Role' }
User:
  type: object
  properties:
    id: { type: string, format: uuid }
    fullName: { type: string }
    phone: { type: string }
    email: { type: string, format: email }
    role: { $ref: '#/Role' }
    status: { $ref: '#/AccountStatus' }
    createdAt: { type: string, format: date-time }
UserUpdate:
  type: object
  properties: { fullName: { type: string }, phone: { type: string }, email: { type: string, format: email } }
Location:
  type: object
  required: [address]
  properties: { address: { type: string }, latitude: { type: number }, longitude: { type: number } }
VehicleType: { type: string, enum: [BIKE, CAR_4_SEATS, CAR_7_SEATS] }
BookingStatus: { type: string, enum: [PENDING_DRIVER, SENT_TO_DRIVER, ACCEPTED, CANCELLED, NO_DRIVER_FOUND] }
BookingCreate:
  type: object
  required: [pickup, dropoff, vehicleType]
  properties:
    pickup: { $ref: '#/Location' }
    dropoff: { $ref: '#/Location' }
    vehicleType: { $ref: '#/VehicleType' }
    pickupTime: { type: string, format: date-time }
    note: { type: string }
Booking:
  type: object
  properties:
    id: { type: string, format: uuid }
    customerId: { type: string, format: uuid }
    status: { $ref: '#/BookingStatus' }
    pickup: { $ref: '#/Location' }
    dropoff: { $ref: '#/Location' }
    vehicleType: { $ref: '#/VehicleType' }
    pickupTime: { type: string, format: date-time }
    note: { type: string }
    estimatedFare: { type: number }
    driver: { $ref: '#/DriverSummary' }
    tripId: { type: string, format: uuid, nullable: true }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
BookingList:
  type: object
  properties: { items: { type: array, items: { $ref: '#/Booking' } }, pagination: { $ref: '#/Pagination' } }
DriverActivityStatus: { type: string, enum: [ONLINE, OFFLINE, BUSY] }
DriverSummary:
  type: object
  properties:
    id: { type: string, format: uuid }
    fullName: { type: string }
    phone: { type: string }
    averageRating: { type: number }
    vehicle: { $ref: '#/Vehicle' }
Driver:
  allOf:
    - $ref: '#/User'
    - type: object
      properties:
        activityStatus: { $ref: '#/DriverActivityStatus' }
        averageRating: { type: number }
        currentLocation: { $ref: '#/Location' }
DriverStatusUpdate:
  type: object
  required: [activityStatus]
  properties: { activityStatus: { $ref: '#/DriverActivityStatus' }, latitude: { type: number }, longitude: { type: number } }
OfferStatus: { type: string, enum: [PENDING, ACCEPTED, REJECTED, EXPIRED] }
BookingOffer:
  type: object
  properties:
    id: { type: string, format: uuid }
    bookingId: { type: string, format: uuid }
    status: { $ref: '#/OfferStatus' }
    pickup: { $ref: '#/Location' }
    dropoff: { $ref: '#/Location' }
    vehicleType: { $ref: '#/VehicleType' }
    estimatedFare: { type: number }
    expiresAt: { type: string, format: date-time }
RejectRequest:
  type: object
  properties: { reason: { type: string } }
TripStatus: { type: string, enum: [CREATED, IN_PROGRESS, COMPLETED] }
Trip:
  type: object
  properties:
    id: { type: string, format: uuid }
    bookingId: { type: string, format: uuid }
    customerId: { type: string, format: uuid }
    driver: { $ref: '#/DriverSummary' }
    status: { $ref: '#/TripStatus' }
    pickup: { $ref: '#/Location' }
    dropoff: { $ref: '#/Location' }
    startedAt: { type: string, format: date-time, nullable: true }
    completedAt: { type: string, format: date-time, nullable: true }
    fare: { type: number }
    paymentId: { type: string, format: uuid, nullable: true }
    rated: { type: boolean }
TripList:
  type: object
  properties: { items: { type: array, items: { $ref: '#/Trip' } }, pagination: { $ref: '#/Pagination' } }
TripStatusUpdate:
  type: object
  required: [status]
  properties: { status: { $ref: '#/TripStatus' } }
Vehicle:
  type: object
  properties:
    id: { type: string, format: uuid }
    driverId: { type: string, format: uuid }
    plateNumber: { type: string }
    type: { $ref: '#/VehicleType' }
    brand: { type: string }
    model: { type: string }
    color: { type: string }
    status: { type: string, enum: [ACTIVE, INACTIVE] }
VehicleInput:
  type: object
  required: [plateNumber, type]
  properties:
    plateNumber: { type: string }
    type: { $ref: '#/VehicleType' }
    brand: { type: string }
    model: { type: string }
    color: { type: string }
    status: { type: string, enum: [ACTIVE, INACTIVE] }
VehicleList:
  type: object
  properties: { items: { type: array, items: { $ref: '#/Vehicle' } }, pagination: { $ref: '#/Pagination' } }
PaymentMethod: { type: string, enum: [CASH, ONLINE] }
PaymentStatus: { type: string, enum: [PENDING, PROCESSING, SUCCESS, FAILED] }
Payment:
  type: object
  properties:
    id: { type: string, format: uuid }
    tripId: { type: string, format: uuid }
    amount: { type: number }
    method: { $ref: '#/PaymentMethod' }
    status: { $ref: '#/PaymentStatus' }
    providerTransactionId: { type: string, nullable: true }
    failureReason: { type: string, nullable: true }
    paidAt: { type: string, format: date-time, nullable: true }
PayRequest:
  type: object
  required: [method]
  properties: { method: { $ref: '#/PaymentMethod' }, returnUrl: { type: string, format: uri, description: Bắt buộc khi method=ONLINE } }
PayResponse:
  type: object
  properties:
    payment: { $ref: '#/Payment' }
    redirectUrl: { type: string, format: uri, nullable: true, description: URL của Payment Provider }
PaymentWebhook:
  type: object
  required: [transactionId, paymentId, status]
  properties:
    transactionId: { type: string }
    paymentId: { type: string, format: uuid }
    status: { type: string, enum: [SUCCESS, FAILED] }
    amount: { type: number }
    failureReason: { type: string }
    timestamp: { type: string, format: date-time }
RatingCreate:
  type: object
  required: [score]
  properties: { score: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string, maxLength: 500 } }
Rating:
  type: object
  properties:
    id: { type: string, format: uuid }
    tripId: { type: string, format: uuid }
    driverId: { type: string, format: uuid }
    customerId: { type: string, format: uuid }
    score: { type: integer }
    comment: { type: string }
    createdAt: { type: string, format: date-time }
AccountStatusUpdate:
  type: object
  required: [status]
  properties: { status: { $ref: '#/AccountStatus' }, reason: { type: string } }
UserList:
  type: object
  properties: { items: { type: array, items: { $ref: '#/User' } }, pagination: { $ref: '#/Pagination' } }
DriverList:
  type: object
  properties: { items: { type: array, items: { $ref: '#/Driver' } }, pagination: { $ref: '#/Pagination' } }
