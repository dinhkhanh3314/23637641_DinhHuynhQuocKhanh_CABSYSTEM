customers:
  get:
    tags: [Admin]
    summary: Danh sách Customer
    description: "FR-26, UC-20, BRL-23. Roles: ADMIN"
    operationId: adminListCustomers
    x-roles: [ADMIN]
    parameters: [ { $ref: '../components/parameters.yaml#/Page' }, { $ref: '../components/parameters.yaml#/Size' }, { name: keyword, in: query, schema: { type: string } } ]
    responses:
      '200': { description: OK, content: { application/json: { schema: { $ref: '../components/schemas.yaml#/UserList' } } } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
customerById:
  get:
    tags: [Admin]
    summary: Chi tiết Customer
    description: "FR-26, UC-20. Roles: ADMIN"
    operationId: adminGetCustomer
    x-roles: [ADMIN]
    parameters: [ { $ref: '../components/parameters.yaml#/CustomerId' } ]
    responses:
      '200': { description: OK, content: { application/json: { schema: { $ref: '../components/schemas.yaml#/User' } } } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Admin]
    summary: Khóa/mở khóa Customer
    description: "FR-26, UC-20. Roles: ADMIN"
    operationId: adminUpdateCustomerStatus
    x-roles: [ADMIN]
    parameters: [ { $ref: '../components/parameters.yaml#/CustomerId' } ]
    requestBody: { required: true, content: { application/json: { schema: { $ref: '../components/schemas.yaml#/AccountStatusUpdate' } } } }
    responses:
      '200': { description: OK, content: { application/json: { schema: { $ref: '../components/schemas.yaml#/User' } } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
