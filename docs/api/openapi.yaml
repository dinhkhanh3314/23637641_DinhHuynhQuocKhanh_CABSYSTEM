openapi: 3.0.3
info:
  title: CABSystem API
  version: 1.0.0
  description: RESTful API cho hệ thống đặt xe CABSystem.
servers:
- url: http://localhost:3000/api
tags:
- name: Authentication
  description: Đăng ký và đăng nhập
- name: Customers
  description: Customer quản lý thông tin và Booking
- name: Drivers
  description: Driver quản lý thông tin, trạng thái và Booking
- name: Bookings
  description: Quản lý Booking và tìm Driver
- name: Trips
  description: Quản lý Trip
- name: Vehicles
  description: Quản lý Vehicle
- name: Payments
  description: Thanh toán
- name: Ratings
  description: Đánh giá Driver
- name: Admin
  description: Admin quản lý Customer, Driver, Vehicle và theo dõi Booking/Trip
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Đăng ký Customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /customers/me:
    get:
      tags:
      - Customers
      summary: Xem profile Customer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thông tin Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Customers
      summary: Cập nhật profile Customer
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /bookings:
    post:
      tags:
      - Bookings
      summary: Tạo Booking
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - Bookings
      summary: Xem lịch sử Booking của Customer
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /bookings/{bookingId}:
    get:
      tags:
      - Bookings
      summary: Xem chi tiết Booking
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Chi tiết Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Bookings
      summary: Hủy Booking
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BookingId'
      responses:
        '204':
          description: Hủy Booking thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{bookingId}/status:
    get:
      tags:
      - Bookings
      summary: Xem trạng thái Booking
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Trạng thái Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{bookingId}/matching:
    post:
      tags:
      - Bookings
      summary: Bắt đầu tìm Driver phù hợp
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Kết quả matching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverMatchResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{bookingId}/alternative-driver:
    post:
      tags:
      - Bookings
      summary: Tìm Driver thay thế
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Đã thực hiện tìm Driver thay thế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverMatchResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /drivers/me:
    get:
      tags:
      - Drivers
      summary: Xem profile Driver
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thông tin Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Drivers
      summary: Cập nhật profile Driver
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /drivers/me/status:
    put:
      tags:
      - Drivers
      summary: Cập nhật trạng thái hoạt động
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/BadRequest'
  /drivers/me/location:
    put:
      tags:
      - Drivers
      summary: Cập nhật vị trí Driver
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: Cập nhật vị trí thành công
        '400':
          $ref: '#/components/responses/BadRequest'
  /drivers/me/bookings:
    get:
      tags:
      - Drivers
      summary: Xem Booking được gửi cho Driver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
  /bookings/{bookingId}/response:
    post:
      tags:
      - Drivers
      summary: Driver chấp nhận hoặc từ chối Booking
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingResponseRequest'
      responses:
        '200':
          description: Đã xử lý phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips:
    get:
      tags:
      - Trips
      summary: Xem lịch sử Trip của Customer
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
  /trips/{tripId}:
    get:
      tags:
      - Trips
      summary: Xem chi tiết và theo dõi Trip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Chi tiết Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/status:
    put:
      tags:
      - Trips
      summary: Driver cập nhật trạng thái Trip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
  /trips/{tripId}/complete:
    post:
      tags:
      - Trips
      summary: Hoàn thành Trip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Trip hoàn thành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
  /drivers/me/vehicles:
    get:
      tags:
      - Vehicles
      summary: Xem Vehicle của Driver
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách Vehicle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      tags:
      - Vehicles
      summary: Thêm Vehicle của Driver
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Vehicle được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
  /drivers/me/vehicles/{vehicleId}:
    get:
      tags:
      - Vehicles
      summary: Xem Vehicle của Driver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Vehicles
      summary: Cập nhật Vehicle của Driver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags:
      - Vehicles
      summary: Xóa Vehicle của Driver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '204':
          description: Xóa thành công
        '404':
          $ref: '#/components/responses/NotFound'
  /payments:
    post:
      tags:
      - Payments
      summary: Tạo yêu cầu thanh toán
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
  /payments/{paymentId}:
    get:
      tags:
      - Payments
      summary: Xem kết quả Payment
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
  /payments/{paymentId}/retry:
    post:
      tags:
      - Payments
      summary: Thực hiện lại Payment
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Đã tạo lại yêu cầu thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
  /trips/{tripId}/rating:
    post:
      tags:
      - Ratings
      summary: Customer đánh giá Driver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
      responses:
        '201':
          description: Rating được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          $ref: '#/components/responses/BadRequest'
  /drivers/{driverId}/ratings:
    get:
      tags:
      - Ratings
      summary: Xem Rating của Driver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Danh sách Rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingListResponse'
  /admin/customers:
    get:
      tags:
      - Admin
      summary: Quản lý danh sách Customer
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/customers/{customerId}:
    get:
      tags:
      - Admin
      summary: Xem Customer
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Admin
      summary: Cập nhật Customer
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateCustomerRequest'
      responses:
        '200':
          description: Cập nhật Customer thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Admin
      summary: Khóa hoặc xóa Customer theo chính sách hệ thống
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: Thực hiện thành công
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/drivers:
    get:
      tags:
      - Admin
      summary: Quản lý danh sách Driver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/drivers/{driverId}:
    get:
      tags:
      - Admin
      summary: Xem Driver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Admin
      summary: Cập nhật thông tin Driver
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateDriverRequest'
      responses:
        '200':
          description: Cập nhật Driver thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Admin
      summary: Khóa hoặc xóa Driver theo chính sách hệ thống
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DriverId'
      responses:
        '204':
          description: Thực hiện thành công
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/vehicles:
    get:
      tags:
      - Admin
      summary: Quản lý Vehicle
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách Vehicle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/vehicles/{vehicleId}:
    get:
      tags:
      - Admin
      summary: Xem Vehicle
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Admin
      summary: Cập nhật Vehicle
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Admin
      summary: Xóa Vehicle
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '204':
          description: Xóa thành công
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/bookings:
    get:
      tags:
      - Admin
      summary: Theo dõi Booking
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách Booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/trips:
    get:
      tags:
      - Admin
      summary: Theo dõi Trip
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/trips/{tripId}:
    get:
      tags:
      - Admin
      summary: Xem chi tiết Trip để hỗ trợ xử lý
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Chi tiết Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: string
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
    Unauthorized:
      description: Chưa đăng nhập hoặc JWT không hợp lệ
    Forbidden:
      description: Không có quyền thực hiện thao tác
    NotFound:
      description: Không tìm thấy tài nguyên
  schemas:
    RegisterRequest:
      type: object
