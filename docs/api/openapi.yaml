openapi: 3.0.0

info:
  title: CABSystem API
  description: REST API cho hệ thống đặt xe CABSystem
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local server

tags:
  - name: Authentication
    description: Đăng ký và đăng nhập
  - name: Customer
    description: Chức năng của Customer
  - name: Booking
    description: Quản lý Booking
  - name: Driver
    description: Chức năng của Driver
  - name: Trip
    description: Quản lý Trip
  - name: Vehicle
    description: Quản lý Vehicle
  - name: Payment
    description: Thanh toán
  - name: Rating
    description: Đánh giá Driver
  - name: Admin
    description: Chức năng quản trị và vận hành

paths:
  # =========================================================
  # AUTHENTICATION
  # =========================================================

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký Customer
      description: Customer đăng ký tài khoản mới.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      description: Customer, Driver hoặc Admin đăng nhập hệ thống.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # =========================================================
  # CUSTOMER
  # =========================================================

  /customers/me:
    get:
      tags:
        - Customer
      summary: Xem thông tin cá nhân
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thông tin Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags:
        - Customer
      summary: Cập nhật thông tin cá nhân
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # =========================================================
  # BOOKING
  # =========================================================

  /bookings:
    post:
      tags:
        - Booking
      summary: Tạo Booking
      description: Customer tạo yêu cầu đặt xe.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Tạo Booking thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    get:
      tags:
        - Booking
      summary: Xem lịch sử Booking
      description: Customer xem các Booking của mình.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bookings/{bookingId}:
    get:
      tags:
        - Booking
      summary: Xem chi tiết Booking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Chi tiết Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Booking
      summary: Hủy Booking
      description: Customer hủy Booking theo chính sách của hệ thống.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Hủy Booking thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{bookingId}/status:
    get:
      tags:
        - Booking
      summary: Xem trạng thái Booking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Trạng thái Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================
  # DRIVER MATCHING
  # =========================================================

  /bookings/{bookingId}/matching:
    post:
      tags:
        - Booking
      summary: Tìm Driver phù hợp
      description: Hệ thống tìm Driver đang hoạt động và có Vehicle phù hợp với Booking.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Kết quả tìm Driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMatchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{bookingId}/alternative-driver:
    post:
      tags:
        - Booking
      summary: Tìm Driver thay thế
      description: Tìm Driver khác khi Driver hiện tại từ chối hoặc không phản hồi.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Kết quả tìm Driver thay thế
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverMatchResponse"
        "404":
          description: Không tìm được Driver phù hợp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # =========================================================
  # DRIVER
  # =========================================================

  /drivers/me:
    get:
      tags:
        - Driver
      summary: Xem thông tin Driver
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thông tin Driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags:
        - Driver
      summary: Cập nhật thông tin Driver
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDriverRequest"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drivers/me/status:
    put:
      tags:
        - Driver
      summary: Cập nhật trạng thái hoạt động
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverStatusRequest"
      responses:
        "200":
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drivers/me/location:
    put:
      tags:
        - Driver
      summary: Cập nhật vị trí Driver
      description: Driver cập nhật vị trí để phục vụ việc tìm kiếm và matching.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Location"
      responses:
        "200":
          description: Cập nhật vị trí thành công
        "401":
          $ref: "#/components/responses/Unauthorized"

  /drivers/me/bookings:
    get:
      tags:
        - Driver
      summary: Xem Booking được gửi
      description: Driver xem các Booking đang chờ phản hồi.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bookings/{bookingId}/response:
    post:
      tags:
        - Driver
      summary: Driver phản hồi Booking
      description: Driver chấp nhận hoặc từ chối Booking.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingResponseRequest"
      responses:
        "200":
          description: Phản hồi Booking thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================
  # TRIP
  # =========================================================

  /trips:
    get:
      tags:
        - Trip
      summary: Xem lịch sử Trip
      description: Customer hoặc Driver xem các Trip liên quan đến mình.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách Trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /trips/{tripId}:
    get:
      tags:
        - Trip
      summary: Xem chi tiết Trip
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Chi tiết Trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /trips/{tripId}/status:
    put:
      tags:
        - Trip
      summary: Cập nhật trạng thái Trip
      description: Driver cập nhật trạng thái Trip trong quá trình thực hiện.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripStatusRequest"
      responses:
        "200":
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /trips/{tripId}/complete:
    post:
      tags:
        - Trip
      summary: Hoàn thành Trip
      description: Driver xác nhận Trip đã hoàn thành.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Trip hoàn thành
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # =========================================================
  # VEHICLE
  # =========================================================

  /drivers/me/vehicles:
    get:
      tags:
        - Vehicle
      summary: Xem Vehicle của Driver
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách Vehicle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

    post:
      tags:
        - Vehicle
      summary: Thêm Vehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleRequest"
      responses:
        "201":
          description: Thêm Vehicle thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /drivers/me/vehicles/{vehicleId}:
    get:
      tags:
        - Vehicle
      summary: Xem Vehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "200":
          description: Thông tin Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Vehicle
      summary: Cập nhật Vehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleRequest"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

    delete:
      tags:
        - Vehicle
      summary: Xóa Vehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "204":
          description: Xóa Vehicle thành công

  # =========================================================
  # PAYMENT
  # =========================================================

  /payments:
    post:
      tags:
        - Payment
      summary: Tạo yêu cầu thanh toán
      description: Tạo Payment sau khi Trip hoàn thành.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Tạo Payment thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"

  /payments/{paymentId}:
    get:
      tags:
        - Payment
      summary: Xem kết quả Payment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Thông tin Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{paymentId}/retry:
    post:
      tags:
        - Payment
      summary: Thanh toán lại
      description: Thực hiện lại Payment khi Payment thất bại và được phép retry.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Payment retry được tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"

  # =========================================================
  # RATING
  # =========================================================

  /trips/{tripId}/rating:
    post:
      tags:
        - Rating
      summary: Đánh giá Driver
      description: Customer đánh giá Driver sau khi Trip hoàn thành.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRatingRequest"
      responses:
        "201":
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          $ref: "#/components/responses/BadRequest"

  /drivers/{driverId}/ratings:
    get:
      tags:
        - Rating
      summary: Xem Rating của Driver
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DriverId"
      responses:
        "200":
          description: Danh sách Rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingListResponse"

  # =========================================================
  # ADMIN - CUSTOMER
  # =========================================================

  /admin/customers:
    get:
      tags:
        - Admin
      summary: Quản lý danh sách Customer
      description: Admin xem danh sách Customer.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/customers/{customerId}:
    get:
      tags:
        - Admin
      summary: Xem Customer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Thông tin Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Admin
      summary: Cập nhật Customer
      description: Admin cập nhật thông tin Customer theo quyền quản trị.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateCustomerRequest"
      responses:
        "200":
          description: Cập nhật Customer thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Admin
      summary: Khóa hoặc xóa Customer
      description: Thực hiện theo chính sách quản lý tài khoản của hệ thống.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "204":
          description: Thực hiện thành công
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================
  # ADMIN - DRIVER
  # =========================================================

  /admin/drivers:
    get:
      tags:
        - Admin
      summary: Quản lý danh sách Driver
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách Driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/drivers/{driverId}:
    get:
      tags:
        - Admin
      summary: Xem Driver
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DriverId"
      responses:
        "200":
          description: Thông tin Driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Admin
      summary: Cập nhật Driver
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DriverId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateDriverRequest"
      responses:
        "200":
          description: Cập nhật Driver thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"

    delete:
      tags:
        - Admin
      summary: Khóa hoặc xóa Driver
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DriverId"
      responses:
        "204":
          description: Thực hiện thành công

  # =========================================================
  # ADMIN - VEHICLE
  # =========================================================

  /admin/vehicles:
    get:
      tags:
        - Admin
      summary: Quản lý Vehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách Vehicle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /admin/vehicles/{vehicleId}:
    put:
      tags:
        - Admin
      summary: Cập nhật Vehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleRequest"
      responses:
        "200":
          description: Cập nhật Vehicle thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

    delete:
      tags:
        - Admin
      summary: Xóa Vehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleId"
      responses:
        "204":
          description: Xóa Vehicle thành công

  # =========================================================
  # ADMIN - BOOKING / TRIP
  # =========================================================

  /admin/bookings:
    get:
      tags:
        - Admin
      summary: Theo dõi Booking
      description: Admin theo dõi các Booking trong hệ thống.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"

  /admin/trips:
    get:
      tags:
        - Admin
      summary: Theo dõi Trip
      description: Admin theo dõi các Trip trong hệ thống.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Danh sách Trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripListResponse"

  /admin/trips/{tripId}:
    get:
      tags:
        - Admin
      summary: Xem chi tiết Trip
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Chi tiết Trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"

# ===========================================================
# COMPONENTS
# ===========================================================

components:
  # ---------------------------------------------------------
  # SECURITY
  # ---------------------------------------------------------

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ---------------------------------------------------------
  # PARAMETERS
  # ---------------------------------------------------------

  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string

    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: string

    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string

    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string

    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string

    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # ---------------------------------------------------------
  # RESPONSES
  # ---------------------------------------------------------

  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Chưa đăng nhập hoặc JWT không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Không có quyền thực hiện chức năng
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------------

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - password
        - fullname
      properties:
        username:
          type: string
          example: customer01
        password:
          type: string
          format: password
          example: Password123
        fullname:
          type: string
          example: Nguyen Van A

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: customer01
        password:
          type: string
          format: password
          example: Password123

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        user:
          $ref: "#/components/schemas/UserSummary"

    UserSummary:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        fullname:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"

    Customer:
      type: object
      properties:
        customerId:
          type: string
        username:
          type: string
        fullname:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED

    UpdateCustomerRequest:
      type: object
      properties:
        fullname:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    AdminUpdateCustomerRequest:
      type: object
      properties:
        fullname:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED

    Driver:
      type: object
      properties:
        driverId:
          type: string
        username:
          type: string
        fullname:
          type: string
        phone:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
        availability:
          $ref: "#/components/schemas/DriverStatus"
        location:
          $ref: "#/components/schemas/Location"

    UpdateDriverRequest:
      type: object
      properties:
        fullname:
          type: string
        phone:
          type: string

    AdminUpdateDriverRequest:
      type: object
      properties:
        fullname:
          type: string
        phone:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED

    DriverStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/DriverStatus"

    DriverStatus:
      type: string
      enum:
        - AVAILABLE
        - BUSY
        - OFFLINE

    Location:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.7769
        longitude:
          type: number
          format: double
          example: 106.7009

    Booking:
      type: object
      properties:
        bookingId:
          type: string
        customerId:
          type: string
        driverId:
          type: string
          nullable: true
        pickupLocation:
          $ref: "#/components/schemas/Location"
        destinationLocation:
          $ref: "#/components/schemas/Location"
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        status:
          $ref: "#/components/schemas/BookingStatus"
        createdAt:
          type: string
          format: date-time

    CreateBookingRequest:
      type: object
      required:
        - pickupLocation
        - destinationLocation
        - vehicleType
      properties:
        pickupLocation:
          $ref: "#/components/schemas/Location"
        destinationLocation:
          $ref: "#/components/schemas/Location"
        vehicleType:
          $ref: "#/components/schemas/VehicleType"

    BookingResponseRequest:
      type: object
      required:
        - response
      properties:
        response:
          type: string
          enum:
            - ACCEPT
            - REJECT

    BookingStatusResponse:
      type: object
      properties:
        bookingId:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"

    BookingStatus:
      type: string
      enum:
        - SEARCHING_DRIVER
        - SENT_TO_DRIVER
        - ACCEPTED
        - CANCELLED
        - COMPLETED

    DriverMatchResponse:
      type: object
      properties:
        bookingId:
          type: string
        driver:
          $ref: "#/components/schemas/Driver"
        matched:
          type: boolean

    BookingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    Trip:
      type: object
      properties:
        tripId:
          type: string
        bookingId:
          type: string
        customerId:
          type: string
        driverId:
          type: string
        status:
          $ref: "#/components/schemas/TripStatus"
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    TripStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/TripStatus"

    TripStatus:
      type: string
      enum:
        - CREATED
        - IN_PROGRESS
        - COMPLETED

    TripListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Trip"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
        driverId:
          type: string
        licensePlate:
          type: string
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        brand:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE

    VehicleRequest:
      type: object
      required:
        - licensePlate
        - vehicleType
      properties:
        licensePlate:
          type: string
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        brand:
          type: string
        model:
          type: string

    VehicleType:
      type: string
      enum:
        - MOTORBIKE
        - CAR_4_SEATS
        - CAR_7_SEATS

    CreatePaymentRequest:
      type: object
      required:
        - tripId
        - method
      properties:
        tripId:
          type: string
        method:
          $ref: "#/components/schemas/PaymentMethod"

    Payment:
      type: object
      properties:
        paymentId:
          type: string
        tripId:
          type: string
        amount:
          type: number
          format: double
        method:
          $ref: "#/components/schemas/PaymentMethod"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        transactionId:
          type: string
          nullable: true

    PaymentMethod:
      type: string
      enum:
        - CASH
        - ELECTRONIC

    PaymentStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - SUCCESS
        - FAILED

    CreateRatingRequest:
      type: object
      required:
        - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    Rating:
      type: object
      properties:
        ratingId:
          type: string
        tripId:
          type: string
        customerId:
          type: string
        driverId:
          type: string
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true

    RatingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Rating"
        total:
          type: integer

    UserRole:
      type: string
      enum:
        - CUSTOMER
        - DRIVER
        - ADMIN

    CustomerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    DriverListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Driver"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    Error:
      type: object
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Dữ liệu không hợp lệ
