          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Ride not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ============================================================
  # ACCESS MANAGEMENT
  # ============================================================

  /access/permissions:
    get:
      summary: Get access permissions
      operationId: getPermissions
