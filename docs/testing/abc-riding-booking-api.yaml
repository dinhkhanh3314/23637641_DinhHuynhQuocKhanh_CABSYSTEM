                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /access/permissions/{permissionId}:
    put:
      summary: Update access permission
      operationId: updatePermission
      tags:
        - Access Management
      security:
        - bearerAuth: []
      parameters:
        - name: permissionId
