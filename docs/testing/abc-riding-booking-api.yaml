      parameters:
        - name: status
          in: query
          required: false
          description: Filter rides by status
          schema:
            type: string
            enum:
              - pending
              - accepted
              - in_progress
              - completed
              - cancelled
        - name: customerId
          in: query
          required: false
          description: Filter rides by customer
          schema:
            type: integer
            format: int64
        - name: driverId
          in: query
          required: false
          description: Filter rides by driver
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Ride list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ride"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
