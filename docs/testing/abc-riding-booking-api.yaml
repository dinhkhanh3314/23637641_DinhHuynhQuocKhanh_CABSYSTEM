openapi: 3.0.0

info:
  title: ABC Ride Booking API
  description: |
    This API provides services for the ABC Company's ride booking system.

    The API supports different types of users including customers, drivers,
    operation staff, and management.

    ### Main Features:
    - **User Authentication**: Login, logout, and forgot password.
    - **User Profile**: View and update personal information.
    - **Customer Management**: Customer registration and account management.
    - **Ride Booking**: Book, track, cancel, and view ride information.
    - **Payment**: Process and view payment information.
    - **Driver Management**: Manage drivers, driver status, and assigned rides.
    - **Vehicle Management**: Manage vehicles used for ride services.
    - **Operation Management**: Manage customers, drivers, vehicles, rides,
      transactions, and problematic rides.
    - **Access Management**: Manage user access permissions.
    - **Business Reports**: View business activities, revenue, ride statistics,
      cancellation rates, completion rates, and driver performance.

  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

paths:
  # ============================================================
  # USER AUTHENTICATION AND PROFILE
  # ============================================================

  /auth/login:
    post:
      summary: User login
      operationId: login
      tags:
        - Users
      requestBody:
        description: Login credentials
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid login information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      summary: User logout
      operationId: logout
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      summary: Request password reset
      operationId: forgotPassword
      tags:
        - Users
      requestBody:
        description: Account information used to reset password
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Password reset request submitted successfully
        "400":
          description: Invalid account information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/profile:
    get:
      summary: Get current user profile
      operationId: getUserProfile
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
