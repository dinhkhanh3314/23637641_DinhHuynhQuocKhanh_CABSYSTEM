# ==============================================================
# COMPONENTS
# ==============================================================

components:
  # ------------------------------------------------------------
  # SECURITY
  # ------------------------------------------------------------

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ------------------------------------------------------------
  # USER SCHEMAS
  # ------------------------------------------------------------

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum:
            - customer
            - driver
            - operation_staff
            - management
        status:
          type: string
          enum:
            - active
            - inactive
      required:
        - id
        - username
        - email
        - role

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/User"

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    UserProfileRequest:
      type: object
      properties:
        fullName:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email

    # ------------------------------------------------------------
    # CUSTOMER SCHEMAS
    # ------------------------------------------------------------

    Customer:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        registrationDate:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - active
            - inactive
      required:
        - customerId
        - userId
        - fullName
        - phoneNumber

    CustomerRegistrationRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        fullName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
      required:
        - username
        - password
        - fullName
        - email
        - phoneNumber

    # ------------------------------------------------------------
    # RIDE SCHEMAS
    # ------------------------------------------------------------

    RideRequest:
      type: object
      properties:
        pickupLocation:
          type: string
        destination:
          type: string
        vehicleType:
          type: string
        note:
          type: string
      required:
        - pickupLocation
        - destination

    Ride:
      type: object
      properties:
        rideId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
          nullable: true
        vehicleId:
          type: integer
          format: int64
          nullable: true
        pickupLocation:
          type: string
        destination:
          type: string
        bookingTime:
          type: string
          format: date-time
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        fare:
          type: number
          format: double
        status:
          type: string
          enum:
            - pending
            - accepted
            - in_progress
            - completed
            - cancelled
        cancellationReason:
          type: string
          nullable: true
      required:
        - rideId
        - customerId
        - pickupLocation
        - destination
        - bookingTime
        - status

    RideTracking:
      type: object
      properties:
        rideId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
        driverName:
          type: string
        vehicleId:
          type: integer
          format: int64
        currentLocation:
          type: string
        status:
          type: string
          enum:
            - pending
            - accepted
            - in_progress
            - completed
            - cancelled
        estimatedArrivalTime:
          type: string
          format: date-time

    RideCancellationRequest:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason

    RideStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - accepted
            - in_progress
            - completed
            - cancelled
      required:
        - status

    DriverRatingRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
      required:
        - rating

    DriverRating:
      type: object
      properties:
        ratingId:
          type: integer
          format: int64
        rideId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
        rating:
          type: integer
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    # ------------------------------------------------------------
    # DRIVER SCHEMAS
    # ------------------------------------------------------------

    Driver:
      type: object
      properties:
        driverId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        fullName:
          type: string
        phoneNumber:
          type: string
        licenseNumber:
          type: string
        status:
          type: string
          enum:
            - online
            - offline
            - busy
            - suspended
        rating:
          type: number
          format: double
      required:
        - driverId
        - userId
        - fullName
        - licenseNumber
        - status

    DriverStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - online
            - offline
            - busy
      required:
        - status

    DriverActivity:
      type: object
      properties:
        activityId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
        activityType:
          type: string
        description:
          type: string
        activityTime:
          type: string
          format: date-time

    # ------------------------------------------------------------
    # VEHICLE SCHEMAS
    # ------------------------------------------------------------

    Vehicle:
      type: object
      properties:
        vehicleId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
        licensePlate:
          type: string
        vehicleType:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
            - maintenance
      required:
        - vehicleId
        - licensePlate
        - vehicleType
        - status

    VehicleRequest:
      type: object
      properties:
        driverId:
          type: integer
          format: int64
        licensePlate:
          type: string
        vehicleType:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string
      required:
        - licensePlate
        - vehicleType

    # ------------------------------------------------------------
    # PAYMENT AND TRANSACTION SCHEMAS
    # ------------------------------------------------------------

    PaymentRequest:
      type: object
      properties:
        rideId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum:
            - cash
            - bank_transfer
            - e_wallet
            - credit_card
        amount:
          type: number
          format: double
      required:
        - rideId
        - paymentMethod
        - amount

    Payment:
      type: object
      properties:
        paymentId:
          type: integer
          format: int64
        rideId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        paymentMethod:
          type: string
        status:
          type: string
          enum:
            - pending
            - successful
            - failed
            - refunded
        paymentTime:
          type: string
          format: date-time
      required:
        - paymentId
        - rideId
        - amount
        - paymentMethod
        - status

    Transaction:
      type: object
      properties:
        transactionId:
          type: integer
          format: int64
        paymentId:
          type: integer
          format: int64
        rideId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        transactionType:
          type: string
          enum:
            - payment
            - refund
        status:
          type: string
          enum:
            - pending
            - successful
            - failed
            - refunded
        transactionTime:
          type: string
          format: date-time

    # ------------------------------------------------------------
    # OPERATION SCHEMAS
    # ------------------------------------------------------------

    ProblemRide:
      type: object
      properties:
        problemId:
          type: integer
          format: int64
        rideId:
          type: integer
          format: int64
        problemType:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - pending
            - processing
            - resolved
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    ProblemRideRequest:
      type: object
      properties:
        resolution:
          type: string
        status:
          type: string
          enum:
            - processing
            - resolved
      required:
        - resolution
        - status

    Permission:
      type: object
      properties:
        permissionId:
          type: integer
          format: int64
        role:
          type: string
        resource:
          type: string
        action:
          type: string
        allowed:
          type: boolean

    PermissionRequest:
      type: object
      properties:
        role:
          type: string
        resource:
          type: string
        action:
          type: string
        allowed:
          type: boolean
      required:
        - role
        - resource
        - action
        - allowed

    # ------------------------------------------------------------
    # REPORT SCHEMAS
    # ------------------------------------------------------------

    BusinessReport:
      type: object
      properties:
        totalCustomers:
          type: integer
        totalDrivers:
          type: integer
        totalVehicles:
          type: integer
        totalRides:
          type: integer
        totalRevenue:
          type: number
          format: double

    RevenueReport:
      type: object
      properties:
        totalRevenue:
          type: number
          format: double
        totalTransactions:
          type: integer
        averageRevenuePerRide:
          type: number
          format: double
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date

    RideReport:
      type: object
      properties:
        totalRides:
          type: integer
        completedRides:
          type: integer
        cancelledRides:
          type: integer
        completionRate:
          type: number
          format: double
        cancellationRate:
          type: number
          format: double

    DriverPerformanceReport:
      type: object
      properties:
        driverId:
          type: integer
          format: int64
        driverName:
          type: string
        totalAssignedRides:
          type: integer
        completedRides:
          type: integer
        cancelledRides:
          type: integer
        completionRate:
          type: number
          format: double
        cancellationRate:
          type: number
          format: double
        averageRating:
          type: number
          format: double

    # ------------------------------------------------------------
    # ERROR SCHEMA
    # ------------------------------------------------------------

    Error:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
        details:
          type: string
      required:
        - errorCode
        - message
