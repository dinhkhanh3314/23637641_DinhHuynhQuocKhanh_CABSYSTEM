services:
  postgres:
    image: postgres:16
    container_name: cabsystem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cabsystem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cabsystem"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-init:
    image: postgres:16
    container_name: cabsystem-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for db in auth_db customer_db driver_db booking_db payment_db; do
        psql -h postgres -U ${POSTGRES_USER} -d postgres
        -tc "SELECT 1 FROM pg_database WHERE datname = '$$db'"
        | grep -q 1 || psql -h postgres -U ${POSTGRES_USER} -d postgres
        -c "CREATE DATABASE $$db";
        done

  mongodb:
    image: mongo:8
    container_name: cabsystem-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7
    container_name: cabsystem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    container_name: cabsystem-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      interval: 10s
      timeout: 10s
      retries: 20

  mock-payment-provider:
    build:
      context: ./mock-payment-provider
    container_name: cabsystem-mock-payment-provider
    restart: unless-stopped
    ports:
      - "4000:4000"

  auth-migrate:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]

  customer-migrate:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/customer_db
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]

  driver-migrate:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/driver_db
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]

  booking-migrate:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/booking_db
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]

  payment-migrate:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment_db
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      customer-service:
        condition: service_started
      driver-service:
        condition: service_started
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-cabsystem123}
      REDIS_URL: redis://redis:6379
      CUSTOMER_GRPC_ADDRESS: customer-service:50052
      DRIVER_GRPC_ADDRESS: driver-service:50053
    expose:
      - "3001"
      - "50051"

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    depends_on:
      customer-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/customer_db
    expose:
      - "3002"
      - "50052"

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    depends_on:
      driver-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/driver_db
      REDIS_URL: redis://redis:6379
    expose:
      - "3003"
      - "50053"

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      driver-service:
        condition: service_started
      trip-service:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/booking_db
      DRIVER_GRPC_ADDRESS: driver-service:50053
      TRIP_GRPC_ADDRESS: trip-service:50055
      KAFKA_BROKERS: kafka:9092
      DRIVER_RESPONSE_TIMEOUT_MS: ${DRIVER_RESPONSE_TIMEOUT_MS:-300000}
    expose:
      - "3004"
      - "50054"

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3005
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/trip_db?authSource=admin
    expose:
      - "3005"
      - "50055"

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      trip-service:
        condition: service_started
      mock-payment-provider:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment_db
      PAYMENT_PROVIDER_URL: http://mock-payment-provider:4000
      TRIP_GRPC_ADDRESS: trip-service:50055
      KAFKA_BROKERS: kafka:9092
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret}
    expose:
      - "3006"
      - "50056"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: 3007
      MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/notification_db?authSource=admin
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: notification-service
    expose:
      - "3007"
      - "50057"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    depends_on:
      auth-service:
        condition: service_started
      customer-service:
        condition: service_started
      driver-service:
        condition: service_started
      booking-service:
        condition: service_started
      trip-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-cabsystem123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-2000}
      AUTH_SERVICE_URL: http://auth-service:3001
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      DRIVER_SERVICE_URL: http://driver-service:3003
      BOOKING_SERVICE_URL: http://booking-service:3004
      TRIP_SERVICE_URL: http://trip-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3006
      NOTIFICATION_SERVICE_URL: http://notification-service:3007
      AUTH_GRPC_ADDRESS: auth-service:50051
      CUSTOMER_GRPC_ADDRESS: customer-service:50052
      DRIVER_GRPC_ADDRESS: driver-service:50053
      BOOKING_GRPC_ADDRESS: booking-service:50054
      TRIP_GRPC_ADDRESS: trip-service:50055
      PAYMENT_GRPC_ADDRESS: payment-service:50056
      NOTIFICATION_GRPC_ADDRESS: notification-service:50057
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  mongodb_data:
